<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OFS Gangster — Membership Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F2EFE9;
    --bg:#0A0A0B;
    --panel:#161215;
    --panel-2:#1D181C;
    --gold:#F2B300;
    --crimson:#8E1B4E;
    --steel:#5B7480;
    --muted:#8A8880;
    --line:#2E282C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, rgba(242,179,0,0.08), transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(142,27,78,0.14), transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .urdu{ font-family:'Noto Nastaliq Urdu','Inter',sans-serif; direction:rtl; line-height:2.4; }
  .display{ font-family:'Anton',sans-serif; letter-spacing:0.04em; }
  .mono{ font-family:'JetBrains Mono',monospace; }

  .wrap{ max-width:640px; margin:0 auto; padding:28px 18px 60px; }

  header.top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:44px; height:44px; border-radius:10px;
    background:#fff; padding:3px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; box-shadow:0 0 0 1px var(--gold);
  }
  .brand .mark img{ width:100%; height:100%; object-fit:cover; border-radius:7px; }
  .brand .name{ font-family:'Anton',sans-serif; font-size:22px; letter-spacing:0.06em; }
  .brand .sub{ color:var(--muted); font-size:11px; margin-top:-4px; }

  /* progress stamps */
  .stamps{ display:flex; gap:8px; margin-bottom:26px; }
  .stamp{
    flex:1; text-align:center; padding:10px 4px; border-radius:10px;
    border:1px solid var(--line); background:var(--panel);
    font-size:11px; color:var(--muted); letter-spacing:0.05em; text-transform:uppercase;
    transition:all .3s ease; position:relative;
  }
  .stamp.done{ border-color:var(--gold); color:var(--gold); background:rgba(212,175,55,0.08); }
  .stamp.active{ border-color:var(--crimson); color:var(--ink); box-shadow:0 0 0 1px var(--crimson) inset; }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 22px;
    margin-bottom:16px;
  }
  h2.step-title{ font-family:'Anton',sans-serif; font-size:28px; letter-spacing:0.03em; margin:0 0 4px; color:var(--gold); }
  p.step-sub{ color:var(--muted); margin:0 0 20px; font-size:14px; }

  label{ display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input[type=text], textarea, select{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:12px 14px; font-size:15px; font-family:inherit; resize:vertical;
  }
  input[type=text]:focus, textarea:focus, select:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  textarea{ min-height:100px; }

  .lang-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .lang-row select{ width:auto; flex:0 0 auto; }

  .rules-box{
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; max-height:320px; overflow-y:auto; margin-bottom:16px;
  }
  .rules-box ol{ margin:0; padding-inline-start:22px; }
  .rules-box li{ margin-bottom:12px; font-size:15px; }
  .rules-box.urdu ol{ padding-inline-start:0; padding-inline-end:22px; }

  .check-row{ display:flex; align-items:flex-start; gap:10px; margin:16px 0; }
  .check-row input{ margin-top:3px; width:18px; height:18px; accent-color:var(--gold); }
  .check-row span{ font-size:14px; color:var(--ink); }

  .admin-card{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px;
  }
  .admin-card .a-name{ font-weight:600; font-size:15px; }
  .admin-card .a-role{ color:var(--muted); font-size:12px; }
  .admin-card .a-num{ font-family:'JetBrains Mono',monospace; color:var(--gold); font-size:14px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--gold); color:#1a1608; border:none; border-radius:10px;
    padding:13px 20px; font-size:15px; font-weight:700; cursor:pointer; width:100%;
    font-family:'Inter',sans-serif; transition:transform .15s ease, filter .15s ease;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn:active{ transform:scale(0.98); }
  .btn:disabled{ background:#4a4736; color:#8a8880; cursor:not-allowed; }
  .btn.ghost{ background:transparent; border:1px solid var(--line); color:var(--muted); }

  .row-2{ display:flex; gap:10px; }
  .row-2 .btn{ width:auto; flex:1; }

  /* final ID card */
  .idcard{
    background:linear-gradient(155deg, #1c1a12 0%, #151417 55%);
    border:1px solid var(--gold); border-radius:18px; padding:24px;
    position:relative; overflow:hidden;
  }
  .idcard::before{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(45deg, rgba(212,175,55,0.03) 0 2px, transparent 2px 12px);
  }
  .idcard .tag{ color:var(--gold); font-size:12px; letter-spacing:0.15em; text-transform:uppercase; }
  .idcard h1{ font-family:'Anton',sans-serif; font-size:40px; margin:2px 0 14px; letter-spacing:0.04em; }
  .idcard .field{ margin-bottom:10px; position:relative; z-index:1; }
  .idcard .field .k{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; }
  .idcard .field .v{ font-size:15px; }
  .idcard .idnum{ font-family:'JetBrains Mono',monospace; color:var(--gold); font-size:15px; }

  .note{ color:var(--muted); font-size:12px; text-align:center; margin-top:18px; }
  .note a{ color:var(--muted); }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }

  /* admin panel */
  .admin-panel .entry{
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:10px; font-size:13px;
  }
  .admin-panel .entry .k{ color:var(--gold); font-size:11px; text-transform:uppercase; letter-spacing:0.06em; }
  /* Google Translate widget — restyled to fit dark theme */
#google_translate_element{ position:fixed; top:10px; right:10px; z-index:999; display:inline-block; }
  #google_translate_element .goog-te-gadget{ font-family:'Inter',sans-serif !important; font-size:0 !important; color:transparent !important; }
  #google_translate_element .goog-te-gadget-simple{
    background:var(--panel-2) !important; border:1px solid var(--line) !important;
    border-radius:8px !important; padding:6px 10px !important; display:inline-flex !important; align-items:center;
  }
  #google_translate_element .goog-te-gadget-simple .goog-te-menu-value{ color:var(--ink) !important; font-size:12px !important; }
  #google_translate_element .goog-te-gadget-simple .goog-te-menu-value span{ color:var(--ink) !important; }
  #google_translate_element img{ display:none !important; }
  .goog-te-banner-frame{ display:none !important; }
  body{ top:0 !important; }
  .goog-tooltip, .goog-tooltip:hover{ display:none !important; }
  .goog-text-highlight{ background:none !important; box-shadow:none !important; }
</style>
</head>

  function googleTranslateElementInit() {

  }
</script>

/* ========================= App state & logic ========================= */
const state = {
  step: 1, // 1 intro, 2 rules, 3 admin, 4 purpose, 5 done
  name: "",
  nickname: "",
  age: "",
  occupation: "",
  country: "",
  city: "",
  rulesRead: false,
  purpose: "",
  memberId: null,
  approved: false,
  rejected: false
};

const stepLabels = ["Profile", "Rules", "Admin", "Purpose"];

function uid(){
  return "OFS-" + Math.floor(100000 + Math.random()*900000);
}

async function saveSubmission(){
  try{
    const key = "member:" + state.memberId;
    const value = JSON.stringify({
      name: state.name,
      nickname: state.nickname,
      age: state.age,
      occupation: state.occupation,
      country: state.country,
      city: state.city,
      purpose: state.purpose,
      memberId: state.memberId,
      status: "pending",
      submittedAt: new Date().toISOString()
    });
    await window.storage.set(key, value, true);
  }catch(e){
    console.error("Could not save submission:", e);
  }
}

let pollTimer = null;

async function pollApproval(){
  try{
    const res = await window.storage.get("member:" + state.memberId, true);
    const d = JSON.parse(res.value);
    if(d.status === "approved"){
      clearInterval(pollTimer);
      state.approved = true;
      render();
    } else if(d.status === "rejected"){
      clearInterval(pollTimer);
      state.rejected = true;
      render();
    }
  }catch(e){
    console.error("Could not check approval status:", e);
  }
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <header class="top">
      <div class="brand">
        <div class="mark"><img src="${LOGO_SRC}" alt="${CONFIG.groupName} logo"></div>
        <div>
          <div class="name">${CONFIG.groupNameFull}</div>
          <div class="sub">${CONFIG.groupTagline}</div>
        </div>
      </div>
      <div class="sub mono" style="color:var(--muted); font-size:11px;">${state.step <= 4 ? "STEP " + state.step + "/4" : "COMPLETE"}</div>
    </header>

    ${state.step <= 4 ? `
    <div class="stamps">
      ${stepLabels.map((l,i)=>{
        const n = i+1;
        const cls = n < state.step ? "done" : (n === state.step ? "active" : "");
        return `<div class="stamp ${cls}">${l}</div>`;
      }).join("")}
    </div>` : ""}

    <div id="stepArea"></div>
  `;

  const area = document.getElementById("stepArea");

  if(state.step === 1) area.innerHTML = renderIntro();
  if(state.step === 2) area.innerHTML = renderRules();
  if(state.step === 3) area.innerHTML = renderAdmin();
  if(state.step === 4) area.innerHTML = renderPurpose();
  if(state.step === 5) area.innerHTML = renderDone();

  attachHandlers();
}

  return `

}

function escapeHtml(str){
  return (str || "").replace(/[&<>"']/g, m => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[m]));
}

function attachHandlers(){
  if(state.step === 1){
    const fields = {
      name: document.getElementById("nameInput"),
      nickname: document.getElementById("nicknameInput"),
      age: document.getElementById("ageInput"),
      occupation: document.getElementById("occupationInput"),
      country: document.getElementById("countryInput"),
      city: document.getElementById("cityInput"),
    };
    const nextBtn = document.getElementById("introNext");
    function checkValid(){
      nextBtn.disabled = !Object.values(fields).every(el => el.value.trim());
    }
    Object.keys(fields).forEach(key=>{
      fields[key].addEventListener("input", ()=>{ state[key] = fields[key].value; checkValid(); });
    });
    checkValid();
    nextBtn.addEventListener("click", ()=>{ state.step = 2; render(); });
  }

  if(state.step === 2){
    const rulesCheck = document.getElementById("rulesCheck");
    const nextBtn = document.getElementById("rulesNext");
    rulesCheck.addEventListener("change", ()=>{ state.rulesRead = rulesCheck.checked; nextBtn.disabled = !state.rulesRead; });
    nextBtn.addEventListener("click", ()=>{ state.step = 3; render(); });
  }

  if(state.step === 3){
    document.getElementById("adminNext").addEventListener("click", ()=>{ state.step = 4; render(); });
  }

  if(state.step === 4){
    const purposeInput = document.getElementById("purposeInput");
    const nextBtn = document.getElementById("purposeNext");
    purposeInput.addEventListener("input", ()=>{
      state.purpose = purposeInput.value;
      nextBtn.disabled = !purposeInput.value.trim();
    });
    nextBtn.addEventListener("click", async ()=>{
      state.memberId = uid();
      state.step = 5;
      render();
      await saveSubmission();
      pollTimer = setInterval(pollApproval, 4000);
    });
  }
}

/* ---- simple admin view: open the artifact URL and add #admin to see submissions ---- */
async function maybeShowAdminPanel(){
  if(location.hash !== "#admin") return;
  const pass = prompt("Admin password:");
  if(pass !== CONFIG.adminPassword){
    alert("Incorrect password.");
    return;
  }
  await renderAdminPanel();
}

async function setStatus(memberId, status){
  try{
    const res = await window.storage.get("member:" + memberId, true);
    const d = JSON.parse(res.value);
    d.status = status;
    await window.storage.set("member:" + memberId, JSON.stringify(d), true);
    await renderAdminPanel();
  }catch(e){
    alert("Could not update status.");
  }
}

async function renderAdminPanel(){
  try{
    const list = await window.storage.list("member:", true);
    const app = document.getElementById("app");
    let html = `<div class="card admin-panel"><h2 class="step-title">Submissions</h2>`;
    if(!list || !list.keys || list.keys.length === 0){
      html += `<p class="step-sub">No submissions yet.</p>`;
    } else {
      const entries = [];
      for(const k of list.keys){
        try{
          const res = await window.storage.get(k, true);
          entries.push(JSON.parse(res.value));
        }catch(e){}
      }
      entries.sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt));

      for(const d of entries){
        const status = d.status || "pending";
        const statusColor = status === "approved" ? "var(--gold)" : (status === "rejected" ? "var(--crimson)" : "var(--muted)");
        html += `<div class="entry">
          <div class="k">${escapeHtml(d.memberId || "")} · <span style="color:${statusColor};text-transform:uppercase;">${escapeHtml(status)}</span></div>
          <div><b>${escapeHtml(d.name)}</b> (${escapeHtml(d.nickname || "")}) — Age ${escapeHtml(d.age || "")} — ${escapeHtml(d.city || "")}, ${escapeHtml(d.country || "")} — ${new Date(d.submittedAt).toLocaleString()}</div>
          <div style="margin-top:6px; color:var(--muted);">Occupation: ${escapeHtml(d.occupation || "")}</div>
          <div style="margin-top:4px; color:var(--muted);">Purpose: ${escapeHtml(d.purpose)}</div>
          <div class="row-2" style="margin-top:10px;">
            <button class="btn" data-approve="${escapeHtml(d.memberId)}" ${status==="approved"?"disabled":""}>Approve</button>
            <button class="btn ghost" data-reject="${escapeHtml(d.memberId)}" ${status==="rejected"?"disabled":""}>Reject</button>
          </div>
        </div>`;
      }
    }
    html += `</div>`;
    app.innerHTML = `<header class="top"><div class="brand"><div class="name">${CONFIG.groupNameFull} — Admin</div></div></header>` + html;

    app.querySelectorAll("[data-approve]").forEach(btn=>{
      btn.addEventListener("click", ()=> setStatus(btn.getAttribute("data-approve"), "approved"));
    });
    app.querySelectorAll("[data-reject]").forEach(btn=>{
      btn.addEventListener("click", ()=> setStatus(btn.getAttribute("data-reject"), "rejected"));
    });
  }catch(e){
    alert("Could not load submissions.");
  }
}

render();
maybeShowAdminPanel();
</script>
</body>
</html>
